<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frog Pickleball · CPL Team Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<script>
  // Set the team color before anything draws, so the 3.5 page never flashes the 3.0 color.
  (function () {
    var q = new URLSearchParams(location.search).get("team");
    var t = q || localStorage.getItem("frogTeam") || "3.0";
    document.body.dataset.team = t;
  })();
</script>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">🐸</span>
    <div class="brandtext">
      <h1>Frog Pickleball <span class="teambadge" id="teamname">…</span></h1>
      <p class="sub" id="sub">CPL team hub</p>
    </div>
    <div class="teamswitch" id="teamswitch" role="group" aria-label="Choose team"></div>
  </div>
  <nav class="tabs" role="tablist">
    <a href="#home" data-tab="home">Home</a>
    <a href="#practice" data-tab="practice">Practice</a>
    <a href="#lineup" data-tab="lineup">Game Plan</a>
    <a href="#players" data-tab="players">Players</a>
    <a href="#partners" data-tab="partners">Partners</a>
    <a href="#schedule" data-tab="schedule">Schedule</a>
    <a href="#scouting" data-tab="scouting">Scouting</a>
    <a href="#about" data-tab="about">How it works</a>
  </nav>
</header>
<main id="app"><p class="loading">Loading team data…</p></main>
<div id="tip" class="hovertip" role="tooltip" hidden></div>
<footer class="foot" id="foot"></footer>
<p class="foot credit">Designed and built by <a href="https://mhdstudios.com" target="_blank" rel="noopener">MHD Studios</a></p>
<script src="app.js?v=__V__"></script>
</body>
</html>
